# Front (MOps.Web) no Netlify. VITE_API_URL é definida no painel do Netlify.
[build]
  base = "src/MOps.Web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# CSP (D-06): só scripts do próprio site; a API fica no Render.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
